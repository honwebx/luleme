name: Build Release (Wails)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.9.1
  # Go 1.23: the only version that satisfies all three constraints:
  #   1. < 1.25, so golang.org/x/tools v0.17.0 (locked by Wails v2.9.1) still
  #      compiles (golang/go#74462: x/tools v0.8.0-v0.25.0 fails on Go 1.25+);
  #   2. != 1.24, which has an importer "package without types" failure on
  #      darwin/arm64 + cgo;
  #   3. <= 1.23 binaries run on macos-15, which (unlike macos-latest/macOS 26+)
  #      does not enforce the LC_UUID load command (Abort trap 6).
  GO_VERSION: '1.23'
  NODE_VERSION: '20'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libglib2.0-dev libwebkit2gtk-4.1-dev \
            libstdc++-12-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            VERSION="$VERSION" node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('wails.json','utf8'));j.info.productVersion=process.env.VERSION;fs.writeFileSync('wails.json',JSON.stringify(j,null,2)+'\n')"
          else
            TAG=""
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Run backend tests
        run: go test ./internal/engines/

      - name: Build Linux
        # ubuntu-latest (24.04+) only ships webkit2gtk-4.1; Wails v2 defaults
        # to 4.0, so the webkit2_41 tag is required (see wails.io docs).
        run: wails build -tags webkit2_41

      - name: Package deb
        run: |
          PKGDIR="$PWD/.pkg/luleme_${VERSION}_amd64"
          mkdir -p "$PKGDIR/DEBIAN" "$PKGDIR/usr/bin" "$PKGDIR/usr/share/applications" "$PKGDIR/usr/share/icons/hicolor/512x512/apps" "$PKGDIR/usr/share/metainfo" dist
          cp build/bin/luleme "$PKGDIR/usr/bin/luleme"
          chmod 755 "$PKGDIR/usr/bin/luleme"
          cp build/linux/luleme.desktop "$PKGDIR/usr/share/applications/luleme.desktop"
          cp build/linux/luleme.metainfo.xml "$PKGDIR/usr/share/metainfo/luleme.metainfo.xml"
          cp build/appicon.png "$PKGDIR/usr/share/icons/hicolor/512x512/apps/luleme.png"
          cat > "$PKGDIR/DEBIAN/control" <<EOF
          Package: luleme
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: luleme
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Description: 录了么 - 网址收录批量查询、提交工具
           Bulk URL index checking and submission tool.
          EOF
          dpkg-deb --build "$PKGDIR" "dist/luleme_${VERSION}_amd64.deb"

      - name: Stage Linux binary
        run: |
          cp build/bin/luleme "dist/luleme_${VERSION}_linux-amd64"
          chmod 755 "dist/luleme_${VERSION}_linux-amd64"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: luleme-linux-deb
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install build tools (mingw, NSIS)
        run: |
          if (!(Get-Command gcc -ErrorAction SilentlyContinue)) { choco install mingw -y }
          if (!(Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y }
          # The NSIS choco package does not add its install dir to PATH, and choco
          # does not refresh PATH for the running session either. Without this,
          # makensis is invisible and `wails build -nsis` silently skips the installer.
          # Locate makensis.exe and persist its directory via GITHUB_PATH for later steps.
          $makensis = Get-ChildItem 'C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS' -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $makensis) {
            Write-Error "makensis.exe not found after choco install nsis"
            exit 1
          }
          $makensis.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:Path = "$($makensis.DirectoryName);$env:Path"
          Get-Command makensis -ErrorAction Stop
          makensis -version

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve version
        run: |
          $ref = $env:GITHUB_REF
          if ($ref -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag.TrimStart('v')
            $env:VERSION = $version
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('wails.json','utf8'));j.info.productVersion=process.env.VERSION;fs.writeFileSync('wails.json',JSON.stringify(j,null,2)+'\n')"
          } else {
            $tag = ''
            $version = '0.0.0-dev'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows installer
        run: |
          # NSIS dir was persisted via GITHUB_PATH in the install step; verify here.
          Get-Command makensis -ErrorAction Stop
          wails build -nsis
          Get-ChildItem build/bin

      - name: Stage installer
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $installer = Get-ChildItem build/bin/*-installer.exe | Select-Object -First 1
          if ($null -eq $installer) {
            Write-Error "NSIS installer not found in build/bin:"
            Get-ChildItem build/bin
            exit 1
          }
          Move-Item -Path $installer.FullName -Destination "dist/luleme-$env:VERSION-windows-amd64-installer.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: luleme-windows-installer
          path: dist/

  build-macos:
    # macos-15 (Sequoia) does not enforce LC_UUID, so Go 1.23 binaries run.
    # macos-latest (macOS 26+) kills Go <= 1.23 binaries (Abort trap 6).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Check Wails CLI
        # Fails fast here (instead of a cryptic dyld abort later) if the
        # Go-built CLI binary cannot launch on this macOS image.
        run: wails version

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            VERSION="$VERSION" node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('wails.json','utf8'));j.info.productVersion=process.env.VERSION;fs.writeFileSync('wails.json',JSON.stringify(j,null,2)+'\n')"
          else
            TAG=""
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build macOS
        run: wails build

      - name: Package macOS app
        run: |
          mkdir -p dist
          hdiutil create -volname "录了么" -fs HFS+ -srcfolder build/bin/luleme.app -ov -format UDZO "dist/luleme_${VERSION}-macos-arm64.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: luleme-macos-dmg
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          ls -la dist
          sha256sum dist/* > dist/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
