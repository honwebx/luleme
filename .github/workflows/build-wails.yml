name: Build Release (Wails)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.9.1
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libstdc++-12-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('wails.json','utf8'));j.info.productVersion=process.env.VERSION;fs.writeFileSync('wails.json',JSON.stringify(j,null,2)+'\n')"
          else
            TAG=""
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Run backend tests
        run: go test ./internal/engines/

      - name: Build Linux
        run: wails build

      - name: Package deb
        run: |
          PKGDIR="$PWD/.pkg/luleme_${VERSION}_amd64"
          mkdir -p "$PKGDIR/DEBIAN" "$PKGDIR/usr/bin" "$PKGDIR/usr/share/applications" "$PKGDIR/usr/share/icons/hicolor/512x512/apps" dist
          cp build/bin/luleme "$PKGDIR/usr/bin/luleme"
          chmod 755 "$PKGDIR/usr/bin/luleme"
          cp build/linux/luleme.desktop "$PKGDIR/usr/share/applications/luleme.desktop"
          cp build/appicon.png "$PKGDIR/usr/share/icons/hicolor/512x512/apps/luleme.png"
          cat > "$PKGDIR/DEBIAN/control" <<EOF
          Package: luleme
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: luleme
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Description: 录了么 - 网址收录批量查询、提交工具
           Bulk URL index checking and submission tool.
          EOF
          dpkg-deb --build "$PKGDIR" "dist/luleme_${VERSION}_amd64.deb"

      - name: Stage Linux binary
        run: |
          cp build/bin/luleme "dist/luleme_${VERSION}_linux-amd64"
          chmod 755 "dist/luleme_${VERSION}_linux-amd64"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: luleme-linux-deb
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install build tools (mingw, NSIS)
        run: |
          if (!(Get-Command gcc -ErrorAction SilentlyContinue)) { choco install mingw -y }
          if (!(Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y }

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve version
        run: |
          $ref = $env:GITHUB_REF
          if ($ref -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag.TrimStart('v')
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('wails.json','utf8'));j.info.productVersion=process.env.VERSION;fs.writeFileSync('wails.json',JSON.stringify(j,null,2)+'\n')"
          } else {
            $tag = ''
            $version = '0.0.0-dev'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows installer
        run: wails build -nsis

      - name: Stage installer
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Move-Item -Path build/bin/luleme-amd64-installer.exe -Destination "dist/luleme-$env:VERSION-windows-amd64-installer.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: luleme-windows-installer
          path: dist/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('wails.json','utf8'));j.info.productVersion=process.env.VERSION;fs.writeFileSync('wails.json',JSON.stringify(j,null,2)+'\n')"
          else
            TAG=""
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build macOS
        run: wails build

      - name: Package macOS app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/bin/luleme.app "dist/luleme_${VERSION}-macos-arm64.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: luleme-macos-zip
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          ls -la dist
          sha256sum dist/* > dist/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
